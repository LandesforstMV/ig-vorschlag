<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Beitrag einreichen – ÖA Social Media</title>
<style>
  :root{
    --forstgruen:#154734; --sommergruen:#3e822c; --fruehlingsgruen:#91ae2d;
    --schwarz:#2d2a26; --hellblau:#87b4c3; --sandgelb:#f6d44d;
    --eichhornorange:#c36015; --rindenbraun:#78482b;
    --bg:#f4f6f0; --card:#ffffff; --text:#2d2a26; --muted:#6b675f;
    --err:#c0392b; --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(900px 400px at 85% -10%, rgba(145,174,45,.18) 0%, transparent 60%),
      radial-gradient(700px 400px at 0% 110%, rgba(21,71,52,.10) 0%, transparent 60%),
      var(--bg);
    color:var(--text); min-height:100vh; padding:16px 12px 40px;
    display:flex; flex-direction:column; align-items:center;
  }
  .wrap{width:100%; max-width:620px;}
  header{text-align:center; margin-bottom:14px;}
  .logo{display:inline-flex; align-items:center; gap:10px; color:var(--forstgruen);
    font-size:1.5rem; font-weight:800; letter-spacing:.3px;}
  .logo .dot{width:13px; height:13px; border-radius:50%;
    background:linear-gradient(135deg,var(--sommergruen),var(--fruehlingsgruen));}
  header p{color:var(--muted); font-size:.9rem; margin-top:4px;}
  .card{background:var(--card); border:1px solid #e2e6da; border-radius:var(--radius);
    padding:18px 18px; box-shadow:0 10px 35px rgba(21,71,52,.10);}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media(max-width:560px){.grid{grid-template-columns:1fr;} .card{padding:14px 12px;}}
  .field{display:flex; flex-direction:column; gap:4px; margin-bottom:8px;}
  .field.full{grid-column:1/-1;}
  label{font-size:.83rem; font-weight:600; color:var(--muted);}
  label b{color:var(--eichhornorange); font-weight:700;}
  input,select,textarea{
    background:#fbfdf9; border:1px solid #d5dccb; color:var(--text);
    border-radius:9px; padding:9px 12px; font-size:.93rem; outline:none; width:100%;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--sommergruen); box-shadow:0 0 0 3px rgba(62,130,44,.16);}
  textarea{min-height:90px; resize:vertical;}
  .drop{
    border:2px dashed #b9c6a8; border-radius:10px; padding:16px 12px; text-align:center;
    cursor:pointer; transition:.2s; color:var(--muted); font-size:.88rem; background:#fbfdf9;
  }
  .drop:hover,.drop.over{border-color:var(--sommergruen); background:rgba(145,174,45,.10); color:var(--text);}
  .drop strong{color:var(--forstgruen);}
  .drop small{display:block; margin-top:3px; font-size:.75rem; opacity:.75;}
  input[type=file]{display:none;}
  .previews{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .thumb{position:relative; width:76px; height:76px; border-radius:9px; overflow:hidden; border:1px solid #d5dccb;}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb button{
    position:absolute; top:3px; right:3px; width:20px; height:20px; border:none; border-radius:50%;
    background:rgba(45,42,38,.75); color:#fff; cursor:pointer; font-size:.75rem; line-height:1;
  }
  .hint{font-size:.75rem; color:var(--muted); margin-top:4px;}
  .check{display:flex; gap:8px; align-items:flex-start; font-size:.8rem; color:var(--muted); margin:2px 0 6px;}
  .check input{width:17px; height:17px; margin-top:1px; accent-color:var(--sommergruen); flex:none;}
  button.submit{
    width:100%; padding:12px; border:none; border-radius:10px; cursor:pointer;
    font-size:.98rem; font-weight:700; color:#fff;
    background:linear-gradient(45deg,var(--forstgruen),var(--sommergruen));
    transition:transform .12s, box-shadow .15s;
    box-shadow:0 4px 14px rgba(21,71,52,.28);
  }
  button.submit:hover{transform:translateY(-1px); box-shadow:0 6px 18px rgba(21,71,52,.34);}
  button.submit:disabled{opacity:.6; cursor:default; transform:none;}
  .status{margin:8px 0 4px; text-align:center; font-size:.88rem; min-height:1.2em; color:var(--err); font-weight:600;}
  .privacy-note{font-size:.75rem; color:var(--muted); text-align:center; margin-top:10px;}
  .privacy-note a{color:var(--sommergruen); text-decoration:underline;}
  .stripe{height:5px; border-radius:3px; margin-bottom:16px;
    background:linear-gradient(90deg,var(--fruehlingsgruen),var(--sommergruen),var(--forstgruen));}
</style>
<base target="_blank">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="dot"></span> Instagram Beitrag einreichen</div>
    <p>Beitragsvorschlag an die ÖA senden</p>
  </header>

  <div class="card">
    <div class="stripe"></div>
    <!-- Klassischer Netlify-Formular-Submit (kein AJAX) -->
    <form id="form" name="beitrag-einreichen" method="POST" data-netlify="true"
          enctype="multipart/form-data" action="/danke.html">
      <input type="hidden" name="form-name" value="beitrag-einreichen">
      <div class="grid">
        <div class="field full">
          <label for="titel">Titel / Thema <b>*</b></label>
          <input id="titel" name="titel" required placeholder="Worum geht es in Kürze?">
        </div>
        <div class="field full">
          <label for="text">Textvorschlag / Beschreibung <b>*</b></label>
          <textarea id="text" name="text" required placeholder="Was soll im Beitrag stehen? Wichtige Fakten, Termine, Zitate..."></textarea>
        </div>
        <div class="field full">
          <label for="termin">Wunsch-Veröffentlichung</label>
          <input id="termin" name="termin" type="date">
        </div>
        <div class="field full">
          <label>Bilder / Videos <b>*</b></label>
          <div class="drop" id="drop">
            <strong>Dateien hierher ziehen</strong> oder klicken zum Auswählen
            <small>JPG, PNG, MP4 · bis 10 MB pro Datei</small>
          </div>
          <!-- KEIN required hier! Das würde Safari/Chrome am unsichtbaren Feld störrisch blockieren. -->
          <input id="files" name="dateien" type="file" accept="image/*,video/*" multiple>
          <div class="previews" id="previews"></div>
          <div class="hint" id="count"></div>
        </div>
        <div class="field full">
          <label class="check">
            <input type="checkbox" name="ds_consent" required>
            <span>Ich habe die Einwilligung aller abgebildeten Personen zur Veröffentlichung auf Social Media. <b style="color:var(--eichhornorange)">*</b></span>
          </label>
        </div>
      </div>
      <div class="status" id="status"></div>
      <button class="submit" id="btn" type="submit">Beitrag absenden</button>
      <div class="privacy-note">
        Weitere Informationen findest du in unserer <a href="/datenschutz" target="_blank">Datenschutzerklärung</a>.
      </div>
    </form>
  </div>
</div>

<script>
/* Nur Vorschau/Drag&Drop + Datei-Prüfung vor dem Absenden.
   Das Absenden selbst läuft ganz klassisch (kein AJAX). */
const form = document.getElementById('form');
const drop = document.getElementById('drop');
const fileInput = document.getElementById('files');
const previews = document.getElementById('previews');
const count = document.getElementById('count');
const statusEl = document.getElementById('status');
let dateien = [];

const dataTransferOk = (typeof DataTransfer !== 'undefined');

drop.addEventListener('click', () => fileInput.click());
['dragover','dragenter'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => hinzufuegen(ev.dataTransfer.files));
fileInput.addEventListener('change', () => {
  hinzufuegen(fileInput.files);
  if (dataTransferOk) fileInput.value = ''; // wird unten aus dem Array wiederhergestellt
});

function hinzufuegen(liste){
  for (const f of liste){
    if (f.size > 10*1024*1024){ alert('"'+f.name+'" ist größer als 10 MB und wird übersprungen.'); continue; }
    // Duplikate (z. B. bei Klick-Auswahl, wenn das Feld nicht geleert werden konnte) vermeiden
    if (![...dateien].some(d => d.name === f.name && d.size === f.size)) dateien.push(f);
  }
  render();
}

function entfernen(i){ dateien.splice(i,1); render(); }

/* Überträgt Dateien aus dem Array ins echte Feld, damit sie mit dem klassischen Submit mitgehen */
function syncFiles(){
  if (!dataTransferOk) return false;
  try {
    const dt = new DataTransfer();
    dateien.forEach(f => dt.items.add(f));
    fileInput.files = dt.files;
    return true;
  } catch(e) { return false; }
}

function render(){
  previews.innerHTML = '';
  dateien.forEach((f,i)=>{
    const d = document.createElement('div');
    d.className = 'thumb';
    if (f.type.startsWith('video/')){
      d.innerHTML = '<video src="'+URL.createObjectURL(f)+'" style="width:100%;height:100%;object-fit:cover;" muted></video>';
    } else {
      d.innerHTML = '<img src="'+URL.createObjectURL(f)+'">';
    }
    const x = document.createElement('button');
    x.type = 'button'; x.textContent = '✕'; x.title = 'Entfernen';
    x.onclick = () => entfernen(i);
    d.appendChild(x);
    previews.appendChild(d);
  });
  count.textContent = dateien.length ? dateien.length + ' Datei(en) ausgewählt' : '';
  syncFiles();
}

/* VOR dem Absenden prüfen: Dateien vorhanden? Dann nativen Submit weiterlaufen lassen. */
form.addEventListener('submit', function(ev){
  statusEl.textContent = '';
  if (dateien.length === 0 && (!fileInput.files || fileInput.files.length === 0)){
    ev.preventDefault();
    statusEl.textContent = '⚠️ Bitte mindestens ein Bild oder Video anhängen.';
    document.getElementById('drop').scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  if (!syncFiles() && (dateien.length > 0 && (!fileInput.files || fileInput.files.length === 0))){
    ev.preventDefault();
    statusEl.textContent = '⚠️ Dein Browser unterstützt Drag & Drop hier nicht – bitte Datei per Klick im Feld auswählen.';
    return;
  }
  document.getElementById('btn').disabled = true;
  document.getElementById('btn').textContent = 'Wird gesendet…';
});
</script>
</body>
</html>
